<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T12 Bin Delete — the bin eats its own label</title>
<link rel="stylesheet" href="_shared/nocturne.css">
<link rel="stylesheet" href="../style.css">
<style>
  /* the component from source/, dressed in Nocturne type */
  #stage{background:radial-gradient(ellipse 65% 60% at 50% 50%,#0E1018 0%,var(--void) 72%);
    --font:var(--f-text);--mono:var(--f-mono);--display:var(--f-display)}
  #stage .bd{position:absolute;left:310px;top:146px;zoom:1;z-index:1}
  #stage .bd .hud-corners{inset:-12px}
  #stage .bd-btn.li-hover:not(.is-open) .bd-lid{transform:rotate(-14deg)}
  .halo{position:absolute;left:50%;top:52%;width:1200px;height:760px;margin:-380px 0 0 -600px;border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(closest-side,rgba(255,122,69,.09),rgba(255,122,69,0))}
</style>
</head>
<body>
<div id="stage" class="grid" data-title="T12 Bin Delete" data-url="veraetogrex-portfolio.github.io/bin-delete">
  <div class="halo"></div>
  <section class="bd" id="danger" data-undo="3200" aria-labelledby="bd-title">
    <div class="hud-corners"></div>
    <p class="bd-kicker">Danger zone</p>
    <h1 class="bd-title" id="bd-title">Delete project?</h1>
    <p class="bd-what"><b>nwd-onboarding</b> · 24 files · 3 collaborators</p>

    <div class="bd-stage">
      <svg class="bd-ring" viewBox="0 0 176 176" aria-hidden="true"><circle cx="88" cy="88" r="80" pathLength="100"/></svg>
      <button class="bd-btn" aria-label="Delete project">
        <svg class="bd-bin" viewBox="0 0 64 64" aria-hidden="true">
          <g class="bd-lid"><path d="M10 17h44"/><path d="M25 17v-5h14v5"/></g>
          <path class="bd-can" d="M15 23l3.5 31a4 4 0 0 0 4 3.5h19a4 4 0 0 0 4-3.5L49 23"/>
          <g class="bd-trash"><path d="M24 44h16M23 37h18"/></g>
        </svg>
        <span class="bd-label" aria-hidden="true">Delete</span>
      </button>
    </div>

    <div class="bd-toast" role="status" hidden>
      <span>Project deleted</span><button class="bd-undo">Undo</button>
    </div>
  </section>
  <div class="status-line"><span>Veraetogrex · T12</span><span>Project settings · danger zone</span></div>
</div>

<script>window.AUTOPLAY = true;</script>
<script src="_shared/stage.js"></script>
<script src="../script.js"></script>
<script>
const bd = document.querySelector('#danger').bin;
const delBtn = document.querySelector('.bd-btn'), undoBtn = document.querySelector('.bd-undo');
const START = [1010, 800];
Stage.init({
  reset: () => bd.reset(),
  cursorStart: START,
  async demo(s) {
    const t0 = performance.now();
    await s.wait(100);
    await s.click(delBtn, { ms: 480, dx: 40 });          // ≈0.6 lid opens, letters hop in
    await s.move([980, 740], 700, { arc: .1 });        // step aside while it folds
    await s.until(t0, 2350);
    await s.click(undoBtn, { ms: 560 });               // ≈2.9 undo: letters fly back out
    await s.until(t0, 4150);
    await s.move(START, 600, { arc: -.12 });
    await s.until(t0, 5100);
  },
});
</script>
</body>
</html>
